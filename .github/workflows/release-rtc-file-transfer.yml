name: Release rtc-file-transfer

# Push a tag like `rtc-file-transfer@v0.1.0` after bumping the version in
# packages/rtc-file-transfer/package.json and its CHANGELOG. `publish`
# publishes to npm and signs the packed tarball with build provenance; `release`
# then creates the GitHub release from that version's CHANGELOG section, with
# the tarball and its Sigstore bundle attached. Check a download with
# `gh attestation verify <file>.tgz -R thebkht/cliplink`.
on:
  push:
    tags:
      - "rtc-file-transfer@v*"

# Read-only for the workflow as a whole. Each job names the writes it needs,
# so a job added to this file later cannot inherit the token that publishes to
# npm without saying so itself — and the job that can write to the repository
# never holds that token.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    permissions:
      contents: read
      # npm trusted publishing and provenance: no long-lived NPM_TOKEN. Also
      # signs the release attestation below.
      id-token: write
      # Recording the tarball's build provenance.
      attestations: write
    # A protected environment with a required reviewer. Pushing the tag no
    # longer publishes on its own — the run waits here until a human
    # approves it, so a stolen credential that can push a tag still cannot
    # reach npm unobserved.
    environment: npm-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        id: version
        run: |
          version=$(node -p "require('./packages/rtc-file-transfer/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "rtc-file-transfer@v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          # A version can be published only once. Re-running on a tag that is
          # already on npm (0.1.0 was published by hand) verifies, then stops.
          if npm view "@thebkht/rtc-file-transfer@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@thebkht/rtc-file-transfer@${version} is already on npm; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: pnpm -F @thebkht/rtc-file-transfer test

      - name: Build
        run: pnpm -F @thebkht/rtc-file-transfer build

      - name: Publish
        if: steps.version.outputs.published != 'true'
        run: pnpm -F @thebkht/rtc-file-transfer publish --provenance --access public --no-git-checks

      # Packed and signed even when the publish above was skipped, so re-running
      # an old tag still gives its release a signed tarball. pnpm pack applies
      # publishConfig and resolves workspace:* just as publish does. The bundle
      # is named *.sigstore.json, the suffix Scorecard's Signed-Releases check
      # looks for.
      - name: Pack
        id: pack
        run: |
          mkdir dist-release
          pnpm -F @thebkht/rtc-file-transfer pack --pack-destination "${PWD}/dist-release"
          echo "tarball=$(ls dist-release/*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Keep the Sigstore bundle beside the tarball
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: cp "${BUNDLE}" "${TARBALL}.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-release
          path: dist-release/
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: publish
    permissions:
      # Creating the GitHub release and uploading its assets.
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-release
          path: dist-release/

      # Runs after a skipped publish too, so re-running an old tag backfills a
      # missing release. An existing release keeps its notes and gets the
      # signed tarball attached.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::notice::Release ${GITHUB_REF_NAME} already exists; attaching the signed tarball."
            gh release upload "${GITHUB_REF_NAME}" dist-release/* --clobber
            exit 0
          fi
          version=$(node -p "require('./packages/rtc-file-transfer/package.json').version")
          section=$(awk -v heading="## ${version}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' packages/rtc-file-transfer/CHANGELOG.md)
          if [ -z "$(printf '%s' "${section}" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no entries under '## ${version}'" >&2
            exit 1
          fi
          {
            echo "📦 https://www.npmjs.com/package/@thebkht/rtc-file-transfer"
            printf '%s\n' "${section}"
          } > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "@thebkht/rtc-file-transfer ${version}" \
            --notes-file release-notes.md \
            dist-release/*
